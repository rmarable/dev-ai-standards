# never a required check (path-filtered); rules-check is the required one.
# dev-ai-standards python test CI (stack python, G5). Written once by apply --stack python;
# project-owned afterwards. Actions are pinned by full commit SHA.
name: python

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "planning-docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "planning-docs/**"

permissions:
  contents: read

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["{{python_min}}", "{{python_latest}}"]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (same pin as ecf CI)
        with:
          persist-credentials: false

      - name: Set up uv
        # The SHA below is a placeholder (not known offline): set the release's full commit SHA.
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0 (same pin as ecf CI)
        with:
          python-version: ${{ matrix.python }}

      - name: Install (locked)
        run: uv sync --locked

      # The project's check entry: ruff, pyright and pytest -n auto (scripts/check --full).
      - name: scripts/check --full
        run: uv run python scripts/check --full
