# Ruff settings for the python stack (dev-ai-standards; rules as in ecf's pyproject.toml).
# Written once by apply when the project has no Ruff settings; project-owned from then on.
line-length = 100
target-version = "{{python_target}}"
# Kit-owned copies are checked by the kit, not by the project's rules.
extend-exclude = ["docs/standards"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "S", "T20"]
ignore = ["PLR2004"]

[lint.pylint]
max-args = 8

[lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106", "S108", "S603", "S607"]
"scripts/**" = ["T201", "S603", "S607"]
