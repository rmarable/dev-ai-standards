# dev-ai-standards kit CI (G5): the kit's own scripts/check on Python 3.9 (stock macOS python3)
# and 3.12. No path filter. Actions are pinned by full commit SHA.
name: kit-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: kit check (python ${{ matrix.python }})
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.9 builds for ubuntu-24.04 in actions/setup-python: unverified until A4.
        python: ["3.9", "3.12"]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (same pin as ecf CI)
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (released 2026-10-22)
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv (for uvx ruff)
        # The SHA below is a placeholder (not known offline): set the release's full commit SHA.
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0 (same pin as ecf CI)

      - name: ShellCheck (install if missing)
        run: |
          set -eu
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --version | head -2
          elif sudo apt-get update -q && sudo apt-get install -y -q shellcheck; then
            shellcheck --version | head -2
          else
            echo "kit-ci: FAIL could not install shellcheck with apt"
            exit 1
          fi

      - name: scripts/check
        run: python ./scripts/check
